services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patitas_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:8080"
    volumes:
      - ./frontend:/var/www/html
    environment:
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL}
    networks:
      - patitas_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patitas_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - mascotas_uploads:/var/www/html/public/uploads/mascotas
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      PP2_API_URL: ${PP2_API_URL}
      PP2_API_KEY: ${PP2_API_KEY}
      PROYECTO_ID: ${PROYECTO_ID}
      MAIL_API_URL: ${MAIL_API_URL}
      MAIL_API_KEY: ${MAIL_API_KEY}
      COMPATIBILITY_SERVICE_URL: ${COMPATIBILITY_SERVICE_URL}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
    networks:
      - patitas_network

  compatibility-service:
    build:
      context: ./microservices/compatibility-service
      dockerfile: Dockerfile
    container_name: patitas_compatibility
    restart: unless-stopped
    ports:
      - "${COMPATIBILITY_PORT}:5000"
    networks:
      - patitas_network
    
  notification-service:
    build:
      context: ./microservices/notification-service
      dockerfile: Dockerfile
    container_name: patitas_notification
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_PORT}:3000"
    environment:
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM}
      TWILIO_CONTENT_SID: ${TWILIO_CONTENT_SID}
    networks:
      - patitas_network

networks:
  patitas_network:
    driver: bridge

volumes:
  mascotas_uploads:
